<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F6B8D0">
    <meta name="description" content="An interactive pastel desktop portfolio of a back-end developer: movable windows, illustrated folders, projects, skills and contact.">
    <meta property="og:title" content="Daniel Medrado's Portfolio">
    <meta property="og:description" content="Explore a cute retro desktop full of projects, skills and stories.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Daniel Medrado's Portfolio</title>
    <script>
      // Apply the saved theme before first paint (no light flash in night mode).
      // Mirrors parseSettings/resolveTheme in src/lib/settings.tsx.
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem("settings")) || {}; } catch (e) {}
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = s.theme === "light" || s.theme === "night" ? s.theme : dark ? "night" : "light";
        var wp = ["grid", "dots", "checker", "sky"].indexOf(s.wallpaper) >= 0 ? s.wallpaper : "grid";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.wallpaper = wp;
        root.style.colorScheme = theme === "night" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
